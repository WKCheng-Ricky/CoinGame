<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Coin Game</title>
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f3ec">
  <script src="theme-boot.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section id="screen-home">
      <button id="btn-theme" class="theme-toggle" type="button" data-state="auto" aria-label="Theme: Auto. Press to switch to Light" title="Theme: Auto. Press to switch to Light">
        <svg class="icon-auto" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
        <svg class="icon-light" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
        <svg class="icon-dark" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="currentColor"/></svg>
      </button>
      <h1 tabindex="-1">Coin Game</h1>
      <p>Make the amount using UK coins.</p>
      <fieldset class="difficulty">
        <legend>Difficulty</legend>
        <label><input type="radio" name="difficulty" id="diff-normal" value="normal" checked autocomplete="off"> Normal: read the coins yourself</label>
        <label><input type="radio" name="difficulty" id="diff-easy" value="easy" autocomplete="off"> Easy: values always shown</label>
      </fieldset>
      <div class="stack-col">
        <button id="btn-endless" class="primary">Endless</button>
        <button id="btn-custom">Custom</button>
        <button id="btn-cashier">Cashier</button>
      </div>
    </section>

    <section id="screen-custom" hidden>
      <h1 tabindex="-1">Custom amount</h1>
      <form id="custom-form" novalidate>
        <label for="custom-input">Amount to make (£)</label>
        <input id="custom-input" type="text" aria-describedby="custom-error" inputmode="decimal" autocomplete="off" placeholder="3.95">
        <p id="custom-error" class="error" role="alert"></p>
        <div class="row">
          <button type="submit" class="primary">Start</button>
          <button type="button" id="custom-back">Back</button>
        </div>
      </form>
    </section>

    <section id="screen-play" hidden>
      <header class="topbar">
        <button id="btn-back">&lsaquo; Back</button>
        <div class="topbar-info">
          <h1 id="play-heading" class="target" tabindex="-1"><span id="play-heading-label" class="label">Make</span> <span id="play-target"></span></h1>
          <p id="play-rounds" class="rounds" hidden></p>
        </div>
      </header>
      <div class="board" data-difficulty="normal">
        <div class="pile-area">
          <h2 id="pile-heading">Your coins</h2>
          <p class="scale-note">1 square = 1 cm on a real coin</p>
          <div id="play-pile" class="pile"></div>
          <p id="play-pile-summary" class="sr-only"></p>
          <p id="play-total" class="total" aria-live="polite"></p>
        </div>
        <div class="tray-area">
          <h2>Add a coin</h2>
          <p class="scale-note">1 square = 1 cm on a real coin</p>
          <div id="play-tray" class="tray"></div>
        </div>
      </div>
      <div id="cashier-answer" class="cashier-answer" hidden>
        <label for="cashier-input">Total on the counter (£)</label>
        <input id="cashier-input" type="text" inputmode="decimal" autocomplete="off" aria-describedby="cashier-error" placeholder="3.95">
        <p id="cashier-error" class="error" role="alert"></p>
      </div>
      <p id="play-message" class="message" aria-live="polite"></p>
      <div class="row actions">
        <button id="btn-check" class="primary">Check</button>
        <button id="btn-clear">Clear</button>
        <button id="btn-next" class="primary" hidden>Next</button>
        <button id="btn-again" class="primary" hidden>Play again</button>
        <button id="btn-change" hidden>Change amount</button>
      </div>
    </section>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
